name: Kyverno logs

description: Show kyverno pods logs

inputs:
  suite:
    description: E2E suite identifier for structured diagnostics
    default: ''
  k8s-version:
    description: Kubernetes version under test
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -e
        kubectl get mutatingwebhookconfigurations
    - shell: bash
      run: |
        set -e
        kubectl get validatingwebhookconfigurations
    - shell: bash
      run: |
        set -e
        kubectl auth can-i --list --as system:serviceaccount:kyverno:kyverno-background-controller 
    - shell: bash
      run: |
        set -e
        kubectl -n kyverno get pod
    - shell: bash
      run: |
        set -e
        # kubectl 1.36+ hides events when describing several objects, and a failed grep
        # here would skip the controller logs below.
        kubectl -n kyverno describe pod --show-events=true | grep -i events -A10 || true
    - shell: bash
      run: |
        set -e
        kubectl -n kyverno logs deploy/kyverno-admission-controller --all-containers
    - shell: bash
      run: |
        set -e
        kubectl -n kyverno logs deploy/kyverno-background-controller --all-containers
    - shell: bash
      run: |
        set -e
        kubectl -n kyverno logs deploy/kyverno-reports-controller --all-containers
    - shell: bash
      run: |
        set -e
        kubectl -n kyverno logs deploy/kyverno-cleanup-controller --all-containers

    # Only E2E callers supply suite/version. Other uses of this action keep
    # their existing log output without creating extra public artifacts.
    - name: Collect E2E diagnostics
      if: inputs.suite != '' && inputs.k8s-version != ''
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
        K8S_VERSION: ${{ inputs.k8s-version }}
      run: |
        set +e
        out="$GITHUB_WORKSPACE/e2e-diagnostics"
        mkdir -p "$out"
        printf 'Suite: %s\nKubernetes: %s\n' "$SUITE" "$K8S_VERSION" > "$out/context.txt"
        kubectl get events -A --sort-by=.metadata.creationTimestamp > "$out/events.txt" 2>&1
        kubectl get mutatingwebhookconfigurations,validatingwebhookconfigurations -o yaml > "$out/webhooks.yaml" 2>&1
        kubectl -n kyverno get pods -o wide > "$out/pods.txt" 2>&1
        kubectl -n kyverno get pods -o name | while IFS= read -r pod; do
          [ -n "$pod" ] || continue
          name="${pod#pod/}"
          kubectl -n kyverno logs "$pod" --all-containers=true --prefix=true > "$out/controller-$name.log" 2>&1 || true
        done
        for kind in validatingpolicies.policies.kyverno.io mutatingpolicies.policies.kyverno.io generatingpolicies.policies.kyverno.io deletingpolicies.policies.kyverno.io imagevalidatingpolicies.policies.kyverno.io; do
          kubectl get "$kind" -A -o yaml >> "$out/policy-status.yaml" 2>&1 || true
        done
        for kind in policyreports.wgpolicyk8s.io clusterpolicyreports.wgpolicyk8s.io reports.openreports.io clusterreports.openreports.io; do
          kubectl get "$kind" -A -o yaml >> "$out/reports.yaml" 2>&1 || true
        done
    - name: Upload E2E diagnostics
      if: always() && inputs.suite != '' && inputs.k8s-version != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: diagnostics-${{ inputs.suite }}-${{ inputs.k8s-version }}-${{ strategy.job-index }}-${{ github.run_attempt }}
        path: e2e-diagnostics/
        retention-days: 14
        if-no-files-found: warn
