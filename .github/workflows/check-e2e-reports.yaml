# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: E2E report tooling

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'scripts/e2e/**'
      - '.github/actions/tests/conformance/run/action.yaml'
      - '.github/actions/kyverno/logs/action.yaml'
      - '.github/actions/workflow/failure-issue/action.yaml'
      - '.github/workflows/check-tests.yaml'
      - '.github/workflows/check-e2e-reports.yaml'
  push:
    branches:
      - main
    paths:
      - 'scripts/e2e/**'
      - '.github/actions/tests/conformance/run/action.yaml'
      - '.github/actions/kyverno/logs/action.yaml'
      - '.github/actions/workflow/failure-issue/action.yaml'
      - '.github/workflows/check-tests.yaml'
      - '.github/workflows/check-e2e-reports.yaml'

jobs:
  report-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test JSON-to-JUnit and cross-version summary
        run: python3 -m unittest discover -s scripts/e2e -p 'test_*.py' -v
